[project]
name = "market-pulse-scraper"
version = "0.1.0"
description = "Responsible public-price collection and transparent pricing analysis"
requires-python = ">=3.12,<3.13"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27", "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
